name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv run ruff check src migrations tests
      - run: uv run ruff format --check src migrations tests
      - run: uv run mypy
      - run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u ../apps/web/src/lib/api/openapi.json /tmp/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
