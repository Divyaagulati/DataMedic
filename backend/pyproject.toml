[project]
name = "datamedic-backend"
version = "0.1.0"
description = "DataMedic backend: API, background workers and (later) the analysis engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "celery[redis]==5.7.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamedic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires PostgreSQL (TEST_ADMIN_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:datamedic.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["datamedic"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datamedic.workers.tasks"]
disallow_untyped_decorators = false
